name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon only. `macos-latest` is a moving alias that has pointed
        # at Intel in the past, and the `-large` variants are Intel today, so the
        # runner is pinned rather than left to drift.
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      # The end-to-end tests use Git LFS the way a user would, so the filter has
      # to be installed or `git add` stores the data itself and the tests pass
      # while proving the opposite of what they claim.
      - run: git lfs install
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  vectors:
    name: conformance vectors are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # tests/vectors.json is generated, committed, and replayed by a second
      # implementation in another repository. A stale copy there means the two
      # agree about a format neither of them writes any more, so the file is
      # regenerated here and the build fails if it moved.
      - run: cargo run -q -p tsp-core --example gen_vectors > /tmp/vectors.json
      - run: diff -u tests/vectors.json /tmp/vectors.json

      # The reader lives in another repository and keeps its own copy of the
      # file above. Nothing on that side can tell that its copy is behind — a
      # subset of the vectors replays exactly as well as the whole — so the
      # comparison has to happen from here, where both are visible.
      #
      # Skipped when READER_REPO is unset, which is what makes a fork's pull
      # request pass without the token this needs.
      - name: Check out the reader
        if: vars.READER_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.READER_REPO }}
          ref: ${{ vars.READER_REF }}
          token: ${{ secrets.READER_TOKEN }}
          path: reader
      - name: The reader replays the same vectors
        if: vars.READER_REPO != ''
        run: diff -u tests/vectors.json reader/modules/tsp/testdata/vectors.json

  # The release builds a Windows binary, so Windows has to be built and tested
  # somewhere. Only the library's own tests run here: the end-to-end suite
  # drives shell scripts through `sh`, which is a Unix assumption the fixtures
  # make rather than one the tool makes.
  windows:
    name: windows builds and passes the library tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git lfs install
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test -p tsp-core

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Advisories are only half the question. This one is about what a released
  # binary is allowed to carry: an explicit licence allow-list, and no source
  # other than crates.io.
  deny:
    name: licences and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
