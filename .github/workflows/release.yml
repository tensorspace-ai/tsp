name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags`. The tag is the only input,
# and the job refuses one that disagrees with Cargo.toml rather than publishing
# a version nobody asked for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: the tag matches the manifest
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "v$manifest" ]; then
            echo "tag $tag does not match Cargo.toml version $manifest" >&2
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl is the one target needing a linker the runner does not ship. The
      # dependency graph is pure Rust, so nothing else needs a C toolchain.
      - if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p tsp-cli

      # Completions and the man page come from the clap definition, so they
      # cannot describe flags the binary does not have.
      - name: Package
        shell: bash
        run: |
          version="${{ needs.check.outputs.version }}"
          name="tsp-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tsp.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/tsp" "dist/$name/"
            tsp="target/${{ matrix.target }}/release/tsp"
            # A cross-compiled binary cannot be run here to generate these.
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || \
               [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
              mkdir -p "dist/$name/completions"
              for shell in bash zsh fish; do
                "$tsp" completions "$shell" > "dist/$name/completions/tsp.$shell"
              done
              "$tsp" man > "dist/$name/tsp.1"
            fi
          fi
          cp README.md LICENSE CHANGELOG.md "dist/$name/"
          cp docs/format.md "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    name: publish the release
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # One file, so `sha256sum -c SHA256SUMS` verifies the whole release.
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: CHANGELOG.md
          draft: true
          fail_on_unmatched_files: true

  # Deliberately last, and deliberately separate: crates.io cannot be undone,
  # so it runs only once the binaries exist. tsp-core must land before the CLI
  # that depends on it.
  crates-io:
    name: publish to crates.io
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Skips a version already on the registry, so re-running a release after
      # fixing one platform's binary does not fail on the publish that already
      # succeeded. A version can never be replaced, only skipped.
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for crate in tsp-core tsp-cli; do
            if curl -sf -A "tsp-release" "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
              echo "$crate $VERSION is already published; skipping"
            else
              cargo publish --locked -p "$crate"
            fi
          done
