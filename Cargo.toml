[workspace]
resolver = "3"
members = ["crates/tsp-core", "crates/tsp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# 1.85 is the floor edition 2024 requires, and this said 1.85 for a long time
# without ever being run against it. The first real 1.85 build found the answer:
# `graph.rs`, `plotdata.rs` and `repo.rs` use let-chains, stable since 1.88.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/tensorspace-ai/tsp"
homepage = "https://github.com/tensorspace-ai/tsp"

[workspace.dependencies]
tsp-core = { version = "0.1.0", path = "crates/tsp-core" }

# Release profile for a short-lived CLI that reads small YAML documents and
# spawns git. Moving bytes is git-lfs's job, so startup dominates runtime.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
