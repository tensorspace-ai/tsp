[package]
name = "ds-lfs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23.0"
ds-core = { version = "0.1.0", path = "../ds-core" }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync"] }
tokio-util = { version = "0.7.19", features = ["io"] }
url = "2.5.8"
