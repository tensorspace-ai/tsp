[package]
description = "Reproducible pipelines and experiments, versioned in git"
name = "tsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No async runtime and no HTTP client: transfers belong to git-lfs now, so the
# CLI spawns git and reads YAML and nothing else.
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
tsp-core = { version = "0.1.0", path = "../tsp-core" }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
