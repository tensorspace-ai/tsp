[package]
# The crate is `tsp-cli` because `tsp` on crates.io is taken by an abandoned
# 2017 Tendermint crate that was never yanked. The binary is still `tsp`.
name = "tsp-cli"
description = "Reproducible pipelines and experiments, versioned in git — stages, staleness and experiments on top of git and Git LFS"
readme = "README.md"
keywords = ["pipeline", "reproducibility", "git-lfs", "mlops", "dvc"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "tsp"
path = "src/main.rs"

# No async runtime and no HTTP client: transfers belong to git-lfs now, so the
# CLI spawns git and reads YAML and nothing else.
[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
tsp-core = { version = "0.1.0", path = "../tsp-core" }
serde_json = "1.0.151"
clap_complete = "4.6.8"
clap_mangen = "0.3.0"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"
