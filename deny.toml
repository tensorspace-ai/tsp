# cargo-deny: what may end up inside a released binary.
#
# `rustsec/audit-check` in CI covers advisories. This covers the other two
# questions a shipped binary raises — what licence its dependencies carry, and
# whether anything is being pulled from somewhere other than crates.io.

[graph]
all-features = true
# Every target the release builds. Without this the check only sees the graph
# for whichever machine ran it, and a dependency that is Linux-only — which is
# most of the ones with interesting licences — would never be looked at.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
]

[licenses]
# Every entry is permissive and compatible with redistributing a statically
# linked MIT binary. Anything not listed fails the build rather than being
# waved through, so a new dependency's terms are a decision someone makes.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "CC0-1.0",
]
confidence-threshold = 0.9
# The list covers six targets, so on any one of them some entries go unused.
# That is the list doing its job, not a finding.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
